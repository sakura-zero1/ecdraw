[package]
name = "ecdraw-server"
version = "2.0.0"
description = "ECDraw HTTP API server (axum)"
edition = "2021"

[[bin]]
name = "ecdraw-server"
path = "src/main.rs"

[dependencies]
ecdraw-core = { path = "../ecdraw-core", features = ["axum"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"

[[example]]
name = "mvp_flow"
path = "examples/mvp_flow.rs"
