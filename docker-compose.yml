# ECDraw 2.0 Web 部署配置
# 使用方法: docker-compose up -d

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ecdraw-postgres
    environment:
      POSTGRES_USER: ecdraw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ecdraw2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ecdraw-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecdraw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rust API 后端
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: ecdraw-api
    environment:
      DATABASE_URL: postgresql://ecdraw:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ecdraw2
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-changeme_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_refresh}
      SERVER_PORT: 3001
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123456}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecdraw-network

  # Nginx 前端静态文件服务
  frontend:
    image: nginx:alpine
    container_name: ecdraw-frontend
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ecdraw-network
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:

networks:
  ecdraw-network:
    driver: bridge
