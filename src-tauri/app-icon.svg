<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Bolt gradient -->
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <!-- Glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="40" y="40" width="944" height="944" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Subtle glow behind bolt -->
  <ellipse cx="500" cy="460" rx="320" ry="340" fill="url(#glow)"/>

  <!-- Lightning bolt — styled for power distribution (three-phase motif) -->
  <g transform="translate(512,480)">
    <!-- Main bolt -->
    <path d="
      M -40,-280
      L -40,-280 L 50,-40 L 10,-40
      L 130,300 L 20,20 L 80,20
      L -140,-280
      Z
    " fill="url(#bolt)" stroke="none" transform="scale(1.05)"/>

    <!-- Secondary arc left -->
    <path d="
      M -120,-200 L -40,-40 L -70,-40
      L -20,120 L -60,10 L -20,10
      L -120,-200 Z
    " fill="#bae6fd" opacity="0.4" transform="scale(0.5) translate(-280,50)"/>

    <!-- Secondary arc right -->
    <path d="
      M -120,-200 L -40,-40 L -70,-40
      L -20,120 L -60,10 L -20,10
      L -120,-200 Z
    " fill="#bae6fd" opacity="0.4" transform="scale(0.55) translate(280,60)"/>

    <!-- Small spark dots -->
    <circle cx="-160" cy="-180" r="8" fill="#bae6fd" opacity="0.6"/>
    <circle cx="180" cy="-150" r="6" fill="#bae6fd" opacity="0.5"/>
    <circle cx="-140" cy="220" r="5" fill="#bae6fd" opacity="0.4"/>
    <circle cx="160" cy="240" r="7" fill="#bae6fd" opacity="0.35"/>
  </g>

  <!-- Power line accent — thin horizontal line through icon -->
  <g opacity="0.15">
    <line x1="60" y1="900" x2="964" y2="900" stroke="#fff" stroke-width="3"/>
    <circle cx="200" cy="900" r="12" fill="#fff"/>
    <circle cx="512" cy="900" r="12" fill="#fff"/>
    <circle cx="824" cy="900" r="12" fill="#fff"/>
    <!-- small towers -->
    <rect x="195" y="840" width="10" height="60" rx="3" fill="#fff"/>
    <rect x="507" y="840" width="10" height="60" rx="3" fill="#fff"/>
    <rect x="819" y="840" width="10" height="60" rx="3" fill="#fff"/>
  </g>
</svg>
